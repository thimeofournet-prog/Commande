<script>
const ART=[
 {id:'polo',nom:'Polo manches courtes',prix:40,cols:['Bleu marine']},
 {id:'rugby',nom:'Polo rugby manches longues',prix:50,cols:['Rayé bleu / blanc']},
 {id:'sweat',nom:'Sweat à capuche',prix:45,cols:['Rose','Bleu marine','Bleu','Rouge']}];
const TAILLES=['XS','S','M','L','XL','XXL'];
const A=id=>ART.find(a=>a.id===id)||ART[2];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eur=n=>n.toLocaleString('fr-FR')+' €';
const lt=l=>(A(l.article).prix+(l.prenom?5:0))*l.qte;
const ot=o=>o.lignes.reduce((s,l)=>s+lt(l),0);

let orders=[],tab=1,draft=null,q='',flt='';
let canWrite=true,shared=false,localOld=[];
try{localOld=JSON.parse(localStorage.getItem('acsagri_orders')||'[]')}catch(e){}
const saveLocal=()=>{try{localStorage.setItem('acsagri_orders',JSON.stringify(orders))}catch(e){}};
if(localOld.length)orders=localOld.slice();

/* ---------- données (Firebase) ---------- */
const FIREBASE_CONFIG={
  apiKey:"AIzaSyCPXrW80cER7Nch4GyGEuG7aqLKuhwLR30",
  authDomain:"tripratique-2a2fc.firebaseapp.com",
  projectId:"tripratique-2a2fc",
  storageBucket:"tripratique-2a2fc.firebasestorage.app",
  messagingSenderId:"865594448276",
  appId:"1:865594448276:web:a4bf131298b9a549a69781"
};
let fs=null;
const myName=()=>{let n='';try{n=localStorage.getItem('acsagri_me')||''}catch(e){}
  if(!n){n=(prompt("Ton prénom (pour savoir qui a saisi la commande) :")||'').trim();try{localStorage.setItem('acsagri_me',n)}catch(e){}}return n};
const clean=o=>JSON.parse(JSON.stringify(o));
function initShared(){
  try{
    if(!FIREBASE_CONFIG.projectId||FIREBASE_CONFIG.projectId=='COLLE_ICI'){toast("Firebase n'est pas encore configuré dans le fichier.");return}
    firebase.initializeApp(FIREBASE_CONFIG);
    fs=firebase.firestore();
    fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});
    shared=true;orders=[];setStatus();
    fs.collection('orders').onSnapshot(snap=>{
      orders=snap.docs.map(d=>({...d.data(),id:d.id}));refresh();
    },e=>{shared=false;setStatus();fail(e)});
    refresh();
  }catch(e){shared=false;setStatus();toast("Connexion à Firebase impossible.")}
}
async function put(o){
  const i=orders.findIndex(x=>x.id==o.id);if(i>=0)orders[i]=o;else orders.push(o);
  refresh();
  if(!shared){saveLocal();return}
  try{await fs.collection('orders').doc(o.id).set(clean(o))}catch(e){fail(e)}
}
async function patch(o,f){
  Object.assign(o,f);refresh();
  if(!shared){saveLocal();return}
  try{await fs.collection('orders').doc(o.id).update(f)}catch(e){fail(e)}
}
async function remove(id){
  orders=orders.filter(x=>x.id!=id);refresh();
  if(!shared){saveLocal();return}
  try{await fs.collection('orders').doc(id).delete()}catch(e){fail(e)}
}
function fail(e){
  if(e&&e.code=='permission-denied')toast("Accès refusé par Firebase : vérifie les règles de la base.");
  else toast("Enregistrement impossible. Vérifie ta connexion.");
}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',4000)}
function setStatus(){
  $('#status').textContent=shared?(canWrite?'● Partagé en direct':'● Lecture seule'):'● Sur cet appareil seulement';
  $('#add').style.display=(tab==1&&canWrite)?'':'none';
}

/* ---------- affichage ---------- */
function stats(){
  const t=orders.reduce((s,o)=>s+ot(o),0),r=orders.filter(o=>!o.paye).reduce((s,o)=>s+ot(o),0);
  $('#sN').textContent=orders.length;$('#sT').textContent=eur(t);$('#sR').textContent=eur(r);
}
function setTab(n){
  tab=n;$('#t1').className=n==1?'on':'';$('#t2').className=n==2?'on':'';
  $('#app').innerHTML=n==1?`<div class="tools"><input id="q" placeholder="Chercher un nom ou une classe" value="${esc(q)}">
  <select id="flt"><option value="">Toutes</option><option value="np">À payer</option><option value="p">Payées</option><option value="nl">À remettre</option><option value="l">Remises</option></select></div><div id="list"></div>`:'<div id="tot"></div>';
  if(n==1)$('#flt').value=flt;
  setStatus();refresh();
}
function refresh(){
  stats();
  if(tab==1){const l=$('#list');if(l)l.innerHTML=list()}
  else{const t=$('#tot');if(t)t.innerHTML=totals()}
}
function by(o){return o.par?`<div class="sub">Saisi par ${esc(o.par)}</div>`:''}
function list(){
  const f=orders.filter(o=>{
    const s=((o.nom||'')+' '+(o.classe||'')).toLowerCase();
    if(q&&!s.includes(q.toLowerCase()))return false;
    if(flt=='np')return !o.paye; if(flt=='p')return !!o.paye;
    if(flt=='nl')return !o.livre; if(flt=='l')return !!o.livre; return true});
  if(!f.length)return `<div class="empty">${orders.length?'Aucune commande ne correspond.':'Aucune commande pour l’instant.<br>Touche « Nouvelle commande » quand un coupon est rendu.'}</div>`;
  const dis=canWrite?'':'disabled';
  return f.slice().sort((a,b)=>(b.ts||0)-(a.ts||0)).map(o=>`<div class="card"><div data-edit="${esc(o.id)}"><div class="top"><div><div class="nom">${esc(o.nom)}</div><div class="sub">${esc(o.classe)}${o.tel?' · '+esc(o.tel):''}</div></div><div class="amt">${eur(ot(o))}</div></div>
    <ul class="items">${o.lignes.map(l=>`<li>${l.qte} × ${A(l.article).nom}, ${l.taille}, ${esc(l.couleur)}${l.prenom?` — <b>${esc(l.prenom)}</b>`:''}</li>`).join('')}</ul>${by(o)}</div>
    <div class="badges"><button ${dis} class="tg ${o.paye?'pay':'no'}" data-pay="${esc(o.id)}">${o.paye?'Payé'+(o.mode?' ('+o.mode.toLowerCase()+')':''):'À payer'}</button>
    <button ${dis} class="tg ${o.livre?'liv':''}" data-liv="${esc(o.id)}">${o.livre?'Remis':'À remettre'}</button></div></div>`).join('');
}
function totals(){
  let h='';
  if(shared&&localOld.length&&canWrite)h+=`<div class="card"><b>${localOld.length} commande(s) trouvée(s) sur cet appareil</b><div class="sub">Elles ne sont pas encore partagées.</div><button class="btn p" id="imp" style="width:100%;margin-top:8px">Les ajouter à la liste partagée</button></div>`;
  if(!orders.length)return h+'<div class="empty">Les totaux apparaîtront avec les premières commandes.</div>';
  const m={},pre=[];
  orders.forEach(o=>o.lignes.forEach(l=>{
    const k=[l.article,l.taille,l.couleur].join('|');m[k]=(m[k]||0)+l.qte;
    if(l.prenom)pre.push(`${l.prenom} — ${A(l.article).nom}, ${l.taille}, ${l.couleur}${l.qte>1?' (×'+l.qte+')':''}`);}));
  h+='<h2>Quantités à commander</h2>';
  ART.forEach(a=>{
    const rows=Object.keys(m).filter(k=>k.startsWith(a.id+'|')).sort((x,y)=>TAILLES.indexOf(x.split('|')[1])-TAILLES.indexOf(y.split('|')[1]));
    if(!rows.length)return;
    h+=`<table style="margin-bottom:12px"><tr><th colspan="2">${a.nom}</th><th class="n">${rows.reduce((s,k)=>s+m[k],0)}</th></tr>`+
      rows.map(k=>{const[,t,c]=k.split('|');return `<tr><td>${t}</td><td>${esc(c)}</td><td class="n">${m[k]}</td></tr>`}).join('')+'</table>';
  });
  const tot=orders.reduce((s,o)=>s+ot(o),0),enc=orders.filter(o=>o.paye).reduce((s,o)=>s+ot(o),0);
  h+=`<h2>Argent</h2><table><tr><td>Encaissé</td><td class="n">${eur(enc)}</td></tr><tr><td>Reste à encaisser</td><td class="n">${eur(tot-enc)}</td></tr></table>`;
  h+=`<h2>Prénoms à broder (${pre.length})</h2><table>${pre.sort().map(p=>`<tr><td>${esc(p)}</td></tr>`).join('')||'<tr><td>Aucun</td></tr>'}</table>
  <h2>Exporter</h2><button class="btn" id="csv" style="width:100%">Afficher les données (CSV) à copier</button>`;
  return h;
}

/* ---------- formulaire ---------- */
const newLine=()=>({article:'sweat',taille:'M',couleur:'Rose',prenom:'',qte:1});
function lineHtml(l,i){
  const a=A(l.article);
  return `<div class="line" data-i="${i}"><div class="row"><select data-k="article">${ART.map(x=>`<option value="${x.id}" ${x.id==l.article?'selected':''}>${x.nom} (${x.prix} €)</option>`).join('')}</select>
  ${draft.lignes.length>1?`<button class="btn d" data-rm="${i}" style="flex:0 0 48px;padding:8px">✕</button>`:''}</div>
  <div class="row"><select data-k="taille">${TAILLES.map(t=>`<option ${t==l.taille?'selected':''}>${t}</option>`).join('')}</select>
  <select data-k="couleur">${a.cols.map(c=>`<option ${c==l.couleur?'selected':''}>${c}</option>`).join('')}</select></div>
  <div class="row"><input data-k="prenom" placeholder="PRÉNOM (+5 €), facultatif" value="${esc(l.prenom)}" style="text-transform:uppercase">
  <div class="qty"><button class="btn" data-q="-1" data-i="${i}">−</button><b>${l.qte}</b><button class="btn" data-q="1" data-i="${i}">+</button></div></div></div>`;
}
function form(){
  const o=draft;
  $('#modal').innerHTML=`<div class="sheet"><div class="panel">
  <h2 style="margin-top:0">${o.isNew?'Nouvelle commande':'Modifier la commande'}</h2>
  <label>Nom du client</label><input id="f_nom" value="${esc(o.nom)}" autocomplete="off"><div id="dup"></div>
  <div class="row"><div><label>Classe / Promo</label><input id="f_classe" value="${esc(o.classe)}"></div><div><label>Téléphone</label><input id="f_tel" type="tel" value="${esc(o.tel)}"></div></div>
  <div id="lines">${o.lignes.map(lineHtml).join('')}</div>
  <button class="btn" id="addl" style="width:100%;margin-top:10px">+ Ajouter un article</button>
  <div class="tot"><span>Total</span><span id="ftot">${eur(ot(o))}</span></div>
  <label>Paiement</label><select id="f_mode"><option value="">Pas encore payé</option><option>Chèque</option><option>Espèces</option></select>
  <div class="row" style="margin-top:16px"><button class="btn" id="cancel">Annuler</button><button class="btn p" id="ok">Enregistrer</button></div>
  ${o.isNew||!canWrite?'':'<button class="btn d" id="del" style="width:100%;margin-top:10px">Supprimer la commande</button>'}
  </div></div>`;
  $('#f_mode').value=o.mode||'';draft.force=false;showDup();
}
function readBase(){const o=draft;o.nom=$('#f_nom').value;o.classe=$('#f_classe').value;o.tel=$('#f_tel').value;o.mode=$('#f_mode').value}
const norm=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').split(/[^a-z0-9]+/).filter(Boolean).sort().join(' ');
const dupOf=()=>{const n=norm(draft.nom);return n?orders.find(x=>x.id!=draft.id&&norm(x.nom)==n):null};
function showDup(){
  const d=dupOf(),b=$('#dup');if(!b)return;
  if(!d){b.innerHTML='';draft.force=false;const ok=$('#ok');if(ok)ok.textContent='Enregistrer';return}
  b.innerHTML=`<div class="warnbox"><b>⚠ Déjà enregistrée</b><br>${esc(d.nom)}${d.classe?' ('+esc(d.classe)+')':''} : ${d.lignes.map(l=>l.qte+' × '+A(l.article).nom+(l.prenom?' ('+esc(l.prenom)+')':'')).join(', ')} — ${eur(ot(d))}, ${d.paye?'payée':'à payer'}.</div>`;
}
const closeForm=()=>{$('#modal').innerHTML='';draft=null};

document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-edit]');if(!t)return;
  const find=id=>orders.find(x=>x.id==id);
  if(t.id=='t1')setTab(1);
  else if(t.id=='t2')setTab(2);
  else if(t.id=='add'){draft={isNew:1,id:'o'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),nom:'',classe:'',tel:'',mode:'',paye:false,livre:false,lignes:[newLine()]};form()}
  else if(t.dataset.edit){const o=find(t.dataset.edit);if(!o)return;if(!canWrite){toast('Lecture seule : tu ne peux pas modifier.');return}draft=JSON.parse(JSON.stringify(o));form()}
  else if(t.dataset.pay){const o=find(t.dataset.pay);if(o)patch(o,{paye:!o.paye})}
  else if(t.dataset.liv){const o=find(t.dataset.liv);if(o)patch(o,{livre:!o.livre})}
  else if(t.id=='cancel')closeForm();
  else if(t.id=='addl'){readBase();draft.lignes.push(newLine());form()}
  else if(t.dataset.rm){readBase();draft.lignes.splice(+t.dataset.rm,1);form()}
  else if(t.dataset.q){readBase();const l=draft.lignes[+t.dataset.i];l.qte=Math.max(1,l.qte+ +t.dataset.q);form()}
  else if(t.id=='ok'){
    readBase();
    if(!draft.nom.trim()){$('#f_nom').focus();$('#f_nom').style.borderColor='var(--warn)';return}
    if(dupOf()&&!draft.force){draft.force=true;showDup();$('#ok').textContent='Enregistrer quand même';$('#dup').scrollIntoView({block:'center'});return}
    const o=draft;delete o.isNew;delete o.force;
    if(o.mode)o.paye=true;
    o.ts=o.ts||Date.now();if(!o.par)o.par=myName();
    closeForm();put(o);
  }
  else if(t.id=='del'){if(confirm('Supprimer cette commande ?')){const id=draft.id;closeForm();remove(id)}}
  else if(t.id=='imp'){const old=localOld;localOld=[];try{localStorage.removeItem('acsagri_orders')}catch(e){}
    old.forEach(o=>{o.id='o'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);o.ts=o.ts||Date.now();put(o)});toast(old.length+' commande(s) ajoutée(s).')}
  else if(t.id=='csv'){
    const rows=[['Nom','Classe','Téléphone','Article','Taille','Couleur','Prénom','Quantité','Montant','Payé','Remis']];
    orders.forEach(o=>o.lignes.forEach(l=>rows.push([o.nom,o.classe,o.tel,A(l.article).nom,l.taille,l.couleur,l.prenom,l.qte,lt(l),o.paye?'oui':'non',o.livre?'oui':'non'])));
    const txt=rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(';')).join('\n');
    $('#modal').innerHTML=`<div class="sheet"><div class="panel"><h2 style="margin-top:0">Données à copier</h2><p class="small">Copie ce texte et colle-le dans Excel ou Google Sheets.</p><textarea id="ta" rows="12" readonly>${esc(txt)}</textarea><button class="btn p" id="cancel" style="width:100%;margin-top:12px">Fermer</button></div></div>`;
    $('#ta').select();
  }
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id=='f_nom'&&draft){draft.nom=el.value;draft.force=false;showDup();const ok=$('#ok');if(ok)ok.textContent='Enregistrer'}
  else if(el.id=='q'){q=el.value;$('#list').innerHTML=list()}
  else if(draft&&el.dataset.k=='prenom'){const i=+el.closest('.line').dataset.i;draft.lignes[i].prenom=el.value.toUpperCase();$('#ftot').textContent=eur(ot(draft))}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id=='flt'){flt=el.value;$('#list').innerHTML=list();return}
  const k=el.dataset.k;if(!draft||!k||k=='prenom')return;
  const l=draft.lignes[+el.closest('.line').dataset.i];l[k]=el.value;
  if(k=='article'){readBase();l.couleur=A(l.article).cols[0];form()}
  else $('#ftot').textContent=eur(ot(draft));
});
setTab(1);setStatus();initShared();
</script>
</body>
</html>
